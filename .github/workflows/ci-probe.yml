# VAQTINCHALIK: CI umuman ishga tushadimi?
#
# Har bir ishga tushirish `startup_failure` bilan tugaydi — 66 tadan
# 66 tasi, reponing birinchi kunidan beri. Fayl emasligi tekshirilgan
# (YAML toʻgʻri, action'lar mavjud, Actions yoqilgan). Qolgan yagona
# farq — murakkablik: haqiqiy workflow'da `services`, matritsa va
# oʻnlab qadam bor.
#
# Bu fayl eng kichik holatni sinaydi. Agar u ham yiqilsa — nuqson
# hisob darajasida; agar oʻtsa — bizning fayllarimizda.
#
# Javob olingach OʻCHIRILADI.
name: CI probe

on:
  push:
    paths: [".github/workflows/ci-probe.yml"]
  workflow_dispatch:

jobs:
