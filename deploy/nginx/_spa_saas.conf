# SPA va public sahifalar — SaaS rejimi (PLAN 5.6).
#
# Uch xil manzil, uch xil javob:
#
# 1. Ilova yo'llari (`/t/<slug>/…`, `/login`, `/platform/…`) — SPA
#    qobig'i. Ular diskda yo'q, ularni React Router hal qiladi.
# 2. Prerender qilingan public sahifalar (`/uz`, `/ru/privacy`) va
#    `dist/` dagi fayllar — o'zi.
# 3. Qolgan HAMMASI — haqiqiy `404` va `404.html`.
#
# Ilgari 3-band yo'q edi: har qanday manzil (`/wp-admin`, `/.env`,
# xato terilgan havola) SPA qobig'ini `200` bilan olardi. Qidiruv
# tizimi ularni "mavjud sahifa" deb hisoblardi, skaner esa har bir
# sinovga "bor" degan javob olardi.

# Ildiz — sotuv saytining o'zbekcha bosh sahifasi. Ilgari buni
# brauzer qilardi (`MarketingEntry`): bo'sh qobiq yuklanib, keyin
# JS yo'naltirardi — bot uchun bu bo'sh sahifa edi. `$is_args$args`
# — reklama havolasidagi `utm_*` parametrlari yo'qolmasin.
location = / {
    return 301 /uz$is_args$args;
}

# 1. Ilova yo'llari. Ro'yxat `frontend/src/router.tsx` dagi yuqori
#    darajali marshrutlar bilan BIR XIL bo'lishi shart —
#    `frontend/src/__tests__/nginx-routes.test.ts` buni tekshiradi:
#    yangi marshrut qo'shilib, bu yerga yozilmasa, u `404` berardi.
location ~ ^/(t|login|reset-password|invite|platform|support-entry|home|dashboard|profile|children|groups|payments|debtors|attendance|staff|payroll|inventory|expenses|reports|branches|notifications|billing|audit|settings|organization|test-redesign)(/|$) {
    root /usr/share/nginx/html;
    try_files /index.html =404;
}

# 2–3. Fayllar va prerender qilingan sahifalar; qolgani — `404`.
#
# `$uri/index.html` — `$uri/` EMAS. Public sahifalar build'da
# `uz/index.html`, `ru/index.html` … bo'lib yoziladi (frontend/scripts/
# prerender.mjs). `$uri/` katalogga to'g'ri kelganda nginx `/uz` ni
# `/uz/` ga 301 bilan yuborardi — canonical esa `/uz`.
location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/index.html =404;
}

# Oxirida `/` bilan kelgan public manzil (`/uz/`, `/ru/privacy/`) —
# bitta canonical shakl bo'lsin: `/uz`, `/ru/privacy`.
location ~ ^(/(uz|ru|en)(/[a-z-]+)?)/$ {
    return 301 $1;
}

# Statik 404 sahifa — skriptsiz (`NotFoundPage.tsx` izohiga qarang).
error_page 404 /404.html;
location = /404.html {
    root /usr/share/nginx/html;
    internal;
}
