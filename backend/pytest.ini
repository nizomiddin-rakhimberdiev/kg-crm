[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
addopts =
    --strict-markers
    --tb=short
    -ra
testpaths = apps api
markers =
    tenancy: tenant izolyatsiyasiga oid testlar (docs/06 §8 — hech qachon o'tkazib yuborilmaydi)
    big_update: docs/big-update/PLAN.md dagi ma'lum kamchiliklar. Bular
        `xfail(strict=True)` — hozir yiqiladi (xato takrorlandi), tuzatilgach
        XPASS bo'ladi va strict rejim marker'ni olib tashlashga majbur qiladi.
        Qaysilari hali qizil: `pytest -m big_update -rX`
