# Nginx — production reverse proxy (docs/02 §23).
#
# SPA statik fayllardan beriladi, `/api/` va `/admin/` Gunicorn'ga uzatiladi.
# TLS sertifikatlari deploy paytida (certbot) o'rnatiladi.

upstream kg_crm_api {
    server web:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Health check TLS redirectdan chetda qolsin — aks holda load balancer
    # 301 oladi va servisni "o'lik" deb hisoblaydi.
    location = /api/v1/health {
        proxy_pass http://kg_crm_api;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # --- Xavfsizlik sarlavhalari (docs/02 §20) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 20M;

    # --- API ---
    location /api/ {
        proxy_pass http://kg_crm_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://kg_crm_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ { alias /app/staticfiles/; expires 30d; access_log off; }

    # Media — bolalar rasmlari va hujjatlar. Hech qachon ochiq indekslanmasin.
    location /media/  { alias /app/mediafiles/;  add_header X-Robots-Tag "noindex" always; }

    # --- SPA ---
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
