name: Backend CI

# Solo loyihada CI yagona reviewer (docs/06 §2) — shuning uchun u
# maslahat emas, darvoza: lint, type-check va testlar majburiy.

on:
  # `branches: [main]` OLIB TASHLANDI. U bilan hamkor ishlaydigan
  # branch (`abzal2`) hech qachon tekshirilmasdi: kod `main` ga
  # qo'shilgandan keyingina darvozaga duch kelardi — ya'ni eng qimmat
  # paytda. Endi har bir branch'dagi har bir commit tekshiriladi.
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

# Minimal ruxsat: bu workflow hech narsa yozmaydi.
permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kg_crm
          POSTGRES_USER: kg_crm
          POSTGRES_PASSWORD: kg_crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-secret-key
      POSTGRES_DB: kg_crm
      POSTGRES_USER: kg_crm
      POSTGRES_PASSWORD: kg_crm
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Bog'liqliklarni o'rnatish
        run: pip install -r requirements/development.txt

      - name: Bog'liqliklar zaifligi (pip-audit)
        # Ma'lum zaiflik topilsa CI QIZARADI. Bu darvoza bo'lishi
        # kerak: qo'lda tekshirish "keyin qarayman" bo'lib qoladi, va
        # xavfsizlik yangilanishi oylab kutib turadi.
        run: pip-audit -r requirements/production.txt --progress-spinner off

      - name: Lint (ruff)
        run: ruff check .

      - name: Format tekshiruvi (ruff)
        run: ruff format --check .

      - name: Type-check (mypy)
        run: mypy apps api config

      - name: Deploy tekshiruvi (production sozlamalari bilan)
        # Ataylab production sozlamalari: test sozlamalarida HSTS/SSL o'chiq
        # bo'lgani uchun bu tekshiruv hech nimani ushlamasdi.
        # `--fail-level WARNING` — ogohlantirish ham darvozani yopadi.
        env:
          DJANGO_SECRET_KEY: ci-secret-key-long-enough-to-pass-the-entropy-check-0123456789
          DJANGO_ALLOWED_HOSTS: example.com
        run: |
          python manage.py check --deploy --fail-level WARNING \
            --settings=config.settings.production

      - name: Yetishmayotgan migratsiyalar bormi
        # Model o'zgarib, migratsiya yozilmay qolishi eng ko'p uchraydigan
        # solo xato — CI uni har safar ushlaydi.
        run: python manage.py makemigrations --check --dry-run

      - name: Migratsiyalar va RLS holati
        # CLAUDE.md 8-invarianti: `check_rls` HAR BIR `migrate` dan keyin
        # ishlashi shart. Sabab amalda ko'rilgan — qo'llanilgan migratsiya
        # tahrirlangach Django uni qayta ishga tushirmaydi, va jonli baza
        # eski siyosatlar bilan qolib ketadi. Toza CI bazasida bu tekshiruv
        # boshqa savolga javob beradi: migratsiyalar HAQIQATAN 38 ta
        # jadvalga FORCE RLS qo'yadimi, yoki siyosat generatori
        # migratsiyadan ajralib qolganmi.
        run: |
          python manage.py migrate --noinput
          python manage.py check_rls

      - name: Tarjima to'liqligi
        # ALOHIDA va to'plamdan OLDIN (PLAN 4.2): yetishmayotgan
        # tarjima kaliti — eng arzon xato va eng tez signal. To'plam
        # ichida u yuzta boshqa natija orasida ko'rinmay ketardi, bu
        # yerda esa darvoza aniq nom bilan qizaradi.
        #
        # Shu test apostroflarni ham qo'riqlaydi (Q11): ASCII `'`
        # bilan yozilgan kalit ko'zga ko'rinmaydi, lekin u BOSHQA
        # satr va xabar ruscha ilovada o'zbekcha chiqib qoladi.
        run: pytest apps/core/tests/test_i18n.py -q

      - name: Testlar
        # Redis ATAYLAB yo'q: test sozlamalari `LocMemCache` va
        # `CELERY_TASK_ALWAYS_EAGER` ishlatadi, ya'ni to'plam tashqi
        # broker'siz ishlaydi. Buni tekshirdik — Redis o'lik portga
        # yo'naltirilganda ham 602 test o'tadi. Kerak bo'lmagan servis
        # CI'ni sekinlashtiradi va yiqiladigan yana bitta nuqta qo'shadi.
        run: pytest --cov=apps --cov=api --cov-report=term-missing

      - name: Tenant izolyatsiya testlari alohida
        # Bu testlar hech qachon jimgina o'tkazib yuborilmasligi kerak
        # (docs/06 §8). Alohida qadam — natija CI ro'yxatida ko'rinib tursin.
        run: pytest -m tenancy --tb=short
