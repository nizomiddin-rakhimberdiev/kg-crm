# Sertifikat mavjud — to'liq HTTPS rejim.

# Docker'ning ichki DNS'i — `server {}` bloklaridan TASHQARIDA, chunki
# `resolver` http kontekstida e'lon qilinadi va shu fayldagi barcha
# serverlarga tegishli bo'ladi.
#
# Nima uchun kerak: nginx `upstream` blokidagi host nomini FAQAT ishga
# tushganda hal qiladi va IP'ni abadiy saqlaydi. Docker'da esa konteyner
# har qayta ishga tushganda YANGI IP oladi — ya'ni `web` qayta ko'tarilgach
# nginx o'lik manzilga urib, butun saytga `502` qaytarardi. Har bir
# deploy'dan keyin, jimgina.
#
# `proxy_pass` ichida O'ZGARUVCHI ishlatilganda nginx manzilni HAR BIR
# so'rovda qayta hal qiladi. Evaziga `keepalive` yo'qoladi — narx arziydi:
# bir necha millisekund vs. har deploy'da o'lik sayt.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name ${DOMAIN} ${WWW_DOMAIN};

    set $kg_api web:8000;

    # ACME yangilanishi HTTPS'ga haydalmasin.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check haydashdan CHETDA: aks holda load balancer `301`
    # oladi va servisni "o'lik" deb hisoblaydi.
    location = /api/v1/health {
        proxy_pass http://$kg_api;
        # `proxy_set_header Host` ANIQ berilishi shart: aks holda nginx
        # sukut bo'yicha `$proxy_host` ni yuboradi — ya'ni upstream
        # manzilining o'zi, "web:8000". Django buni haqiqiy domen
        # sifatida qabul qilmaydi (`ALLOWED_HOSTS`) va `400 DisallowedHost`
        # bilan yiqiladi — TLS yoqilgandan keyingi HAR bir deploy'da
        # health tekshiruvi shu sababli muvaffaqiyatsiz tugardi.
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN} ${WWW_DOMAIN};

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Xavfsizlik sarlavhalari (docs/02 §20, PLAN 5.6) ---
    # Ro'yxat bitta faylda — `/media/` ham uni qayta `include` qiladi.
    include /etc/nginx/kg-headers.conf;

    include /etc/nginx/kg-shared.conf;

    # Shu SERVERGA xos qo'shimcha yo'llar — mahsulot konfiguratsiyasidan
    # TASHQARIDA.
    #
    # Katalog bo'sh bo'lsa nginx hech narsa qilmaydi (glob hech nimaga
    # mos kelmasligi xato emas), ya'ni odatiy o'rnatmalar buni umuman
    # sezmaydi. radix-crm.uz da bu yerda `/private` demosining
    # proxy bloki yotadi (ADR-13) — uni `tls.conf` ga yozib qo'yish
    # har bir mijoz serveriga o'sha serverda mavjud bo'lmagan
    # konteynerga ishora qilgan yo'lni tarqatardi.
    include /etc/nginx/kg-extra/*.conf;
}
