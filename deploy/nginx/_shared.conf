# Ikkala rejim (HTTP va TLS) uchun UMUMIY bloklar.
#
# Alohida faylda, chunki ikki nusxa ertami-kechmi ajralib qoladi — va
# ajralish aynan xavfsizlik sarlavhasi yoki proxy sozlamasida bo'ladi.

# Upstream manzili o'zgaruvchi orqali — sababi fayl boshidagi
# `resolver` izohida.
set $kg_api web:8000;

client_max_body_size 20M;

# --- API ---
location /api/ {
    proxy_pass http://$kg_api;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# `/admin/` ATAYLAB yo'q (P2-006).
#
# Django admin productionda umuman marshrutlanmaydi (config/urls.py),
# shuning uchun uni proxy qilish faqat yolg'on kutish yaratardi. Vendor
# uchun platforma konsoli bor — u 2FA majburiy va har bir amal mijozga
# ko'rinadi (ADR-10).

# Django statikasi — `collectstatic` yozadi, nginx o'qiydi (umumiy volume).
location /static/ {
    alias /app/staticfiles/;
    expires 30d;
    access_log off;
}

# Media — bolalar rasmlari va hujjatlar.
#
# DIQQAT: nginx'da `add_header` MEROSXO'R EMAS. Bu blok o'zining
# sarlavhasini e'lon qilsa, serverdagi barcha xavfsizlik sarlavhalari
# (nosniff, HSTS, X-Frame-Options) SHU YO'LDA tushib qolardi — aynan
# foydalanuvchi yuklagan fayllar beriladigan joyda. Shuning uchun ular
# bu yerda QAYTA yoziladi.
location /media/ {
    alias /app/mediafiles/;
    add_header X-Robots-Tag           "noindex"          always;
    add_header X-Content-Type-Options "nosniff"          always;
    add_header Content-Disposition    "attachment"       always;
    add_header X-Frame-Options        "DENY"             always;
    add_header Referrer-Policy        "same-origin"      always;
}

# --- SPA + prerender qilingan public sahifalar ---
#
# `try_files … /index.html` — har bir bog'cha o'z manzilida yashaydi
# (`/t/<slug>/…`) va bu yo'llar diskda mavjud emas; ularni React Router
# hal qiladi.
#
# `$uri/index.html` — `$uri/` EMAS. Public sahifalar build'da
# `uz/index.html`, `ru/index.html` … bo'lib yoziladi (frontend/scripts/
# prerender.mjs). `$uri/` katalogga to'g'ri kelganda nginx `/uz` ni
# `/uz/` ga 301 bilan yuborardi — canonical esa `/uz`; bot bu aylanadan
# hech narsa olmasdi. Faylni to'g'ridan-to'g'ri berish redirect'siz.
location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/index.html /index.html;
}

# Oxirida `/` bilan kelgan public manzil (`/uz/`, `/ru/privacy/`) —
# bitta canonical shakl bo'lsin: `/uz`, `/ru/privacy`.
location ~ ^(/(uz|ru)(/[a-z-]+)?)/$ {
    return 301 https://$host$1;
}

gzip on;
gzip_types text/plain text/css application/json application/javascript
           text/xml application/xml image/svg+xml;
gzip_min_length 1024;
