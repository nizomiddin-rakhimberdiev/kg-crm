# Standalone DEMO nusxasi — `radix-crm.uz/private` (ADR-13).
#
# Bu fayl MAHSULOT konfiguratsiyasi emas. Mijozning o'z serveriga
# chiqadigan standalone o'rnatma `tls.conf` ni ishlatadi va ilovani
# domen ILDIZIDA beradi. Bu yerdagi `/private` prefiksi faqat bitta
# narsa uchun: demoni mavjud SaaS sayti bilan BIR DOMENDA ko'rsatish.
#
# Zanjir: brauzer → asosiy nginx (TLS) → shu nginx → private-web.

# `X-Forwarded-Proto` ni QAYTA yozib yubormaslik uchun.
#
# Bu nginx 80-portda turadi, ya'ni `$scheme` har doim `http`. Uni
# to'g'ridan-to'g'ri uzatsak, Django so'rovni "xavfsiz emas" deb
# hisoblab HTTPS'ga qaytarardi — va brauzer cheksiz redirect
# aylanasiga tushardi. Asosiy nginx allaqachon `https` deb belgilagan;
# o'sha qiymat bor bo'lsa — o'zi, bo'lmasa `$scheme`.
map $http_x_forwarded_proto $kg_forwarded_proto {
    default $scheme;
    ~.      $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;

    # Docker ichki DNS'i — konteyner qayta ko'tarilganda yangi IP oladi
    # (sabab `tls.conf` dagi bilan bir xil).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $kg_private_api private-web:8000;

    client_max_body_size 20M;

    # --- API ---
    #
    # Django `/api/v1/...` ni kutadi, brauzer esa `/private/api/v1/...`
    # so'raydi — prefiks shu yerda olib tashlanadi. `proxy_pass` da
    # o'zgaruvchi ishlatilgani uchun nginx'ning avtomatik prefiks
    # kesishi ishlamaydi, shuning uchun `rewrite` aniq yozilgan.
    location /private/api/ {
        rewrite ^/private(/api/.*)$ $1 break;
        proxy_pass http://$kg_private_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $kg_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location /private/static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Ruxsat etilganlar ro'yxati — `_shared.conf` dagi izoh. Demo
    # stendda ham bir xil qoida bo'lsin, aks holda qoidaning qayerda
    # amal qilishini eslab yurish kerak bo'lardi.
    location ~ ^/private/media/([^/]+/(?:brand|avatars)/[^/]+)$ {
        alias /app/mediafiles/$1;
        add_header X-Robots-Tag           "noindex"    always;
        add_header X-Content-Type-Options "nosniff"    always;
        add_header Content-Disposition    "attachment" always;
        add_header X-Frame-Options        "DENY"       always;
    }

    location /private/media/ {
        return 404;
    }

    # --- SPA ---
    #
    # Fayllar `html/private/` ichida yotadi, ya'ni `/private/assets/x.js`
    # to'g'ridan-to'g'ri diskdagi yo'lga tushadi va `alias` kerak emas.
    location /private/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /private/index.html;
    }

    # Prefiksni `/` siz yozganlar uchun.
    location = /private {
        return 301 /private/;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
