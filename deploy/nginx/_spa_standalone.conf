# SPA — standalone rejimi (ADR-13, PLAN 5.6).
#
# Bu yerda sotuv sayti YO'Q: ilova o'rnatilgan domenning ildizida
# yashaydi va har qanday yo'lni React Router hal qiladi (noma'lum
# manzil — kirish yoki bosh sahifaga). Shuning uchun na `/` → `/uz`
# yo'naltirish, na `404` sahifa: ikkalasi ham mijozning o'z serverida
# ilovani buzardi.
location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/index.html /index.html;
}
