# Xavfsizlik sarlavhalari — BITTA joyda (PLAN 5.6, docs/02 §20).
#
# Nega alohida fayl: nginx'da `add_header` MEROSXO'R EMAS. O'z
# sarlavhasini e'lon qilgan har bir `location` serverdagi
# sarlavhalarning HAMMASINI yo'qotadi — va bu jimgina sodir bo'ladi.
# Shuning uchun ro'yxat bir marta yoziladi va kerakli joyga
# `include` qilinadi (`tls.conf`, `http-only.conf`, `/media/`).

# HTTPS'ni brauzer o'zi majburlaydi. `preload` ATAYLAB yo'q: u
# brauzerlar ro'yxatiga yozilish degani va undan chiqish oylab
# davom etadi — bu egasining alohida qarori bo'lishi kerak.
# HTTP rejimda (sertifikatsiz) brauzer bu sarlavhani e'tiborsiz
# qoldiradi — spetsifikatsiya shunday, ya'ni u yerda zarar yo'q.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
# `frame-ancestors 'none'` (CSP) bilan bir xil ma'no — eski
# brauzerlar uchun ham.
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;

# --- Content-Security-Policy ---
#
# Har bir manba sababi bilan; ro'yxatga yangi narsa qo'shishdan oldin
# shu izohni o'qing.
#
# * `script-src 'self'` — inline skript YO'Q, `eval` YO'Q (build
#   tekshirildi). Prerender qilingan sahifadagi JSON-LD — ma'lumot
#   bloki, u bajarilmaydi va CSP unga tegmaydi.
# * `style-src 'unsafe-inline'` — prerender qilingan HTML'da React
#   `style="…"` atributlarini yozadi (animatsiyaning boshlang'ich
#   holati). Ularsiz sahifa JS yuklanguncha buzuq ko'rinardi. Uslub
#   in'ektsiyasi skriptnikiga qaraganda ancha tor xavf.
# * Shriftlar O'Z serverimizdan (`frontend/src/fonts.ts`) — tashqi
#   manba yo'q. Google Fonts 2026-10-03 da olib tashlandi: u har bir
#   tashrifda IP manzilni Google'ga yuborardi.
# * `img-src data: blob:` — rasm yuklashdan oldingi ko'rinish
#   (`URL.createObjectURL`) va kichik inline belgilar.
# * `connect-src 'self'` — API shu domenda; tashqi analitika yo'q.
# * `frame-ancestors 'none'` — sayt boshqa sayt ichiga joylanmaydi
#   (clickjacking).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# Brauzer imkoniyatlari: ilova ularning hech birini ishlatmaydi.
# Ro'yxatda yo'q imkoniyat (masalan, clipboard) sukut bo'yicha shu
# sayt uchun ochiq qoladi — nusxalash tugmalari ishlaydi.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
