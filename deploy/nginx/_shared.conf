# Ikkala rejim (HTTP va TLS) uchun UMUMIY bloklar.
#
# Alohida faylda, chunki ikki nusxa ertami-kechmi ajralib qoladi — va
# ajralish aynan xavfsizlik sarlavhasi yoki proxy sozlamasida bo'ladi.

# Upstream manzili o'zgaruvchi orqali — sababi fayl boshidagi
# `resolver` izohida.
set $kg_api web:8000;

client_max_body_size 20M;

# Yo'naltirishlar NISBIY (`Location: /uz`), to'liq manzil emas
# (PLAN 5.6). nginx to'liq manzilni o'zi yig'ganda konteyner ICHIDAGI
# portni qo'yadi (80/443) — `HTTP_PORT=8080` kabi boshqa portga
# chiqarilgan o'rnatmada `/` → `/uz` brauzerni noto'g'ri portga
# yuborardi. Nisbiy manzilni brauzer joriy manzilga nisbatan o'zi
# to'g'ri hal qiladi (RFC 7231).
absolute_redirect off;

# --- API ---
location /api/ {
    proxy_pass http://$kg_api;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# `/admin/` ATAYLAB yo'q (P2-006).
#
# Django admin productionda umuman marshrutlanmaydi (config/urls.py),
# shuning uchun uni proxy qilish faqat yolg'on kutish yaratardi. Vendor
# uchun platforma konsoli bor — u 2FA majburiy va har bir amal mijozga
# ko'rinadi (ADR-10).

# Django statikasi — `collectstatic` yozadi, nginx o'qiydi (umumiy volume).
location /static/ {
    alias /app/staticfiles/;
    expires 30d;
    access_log off;
}

# Media — bolalar rasmlari va hujjatlar.
#
# DIQQAT: nginx'da `add_header` MEROSXO'R EMAS. Bu blok o'zining
# sarlavhasini e'lon qilsa, serverdagi barcha xavfsizlik sarlavhalari
# (nosniff, HSTS, CSP) SHU YO'LDA tushib qolardi — aynan foydalanuvchi
# yuklagan fayllar beriladigan joyda. Shuning uchun umumiy ro'yxat bu
# yerga ham `include` qilinadi (`_headers.conf`).
location /media/ {
    alias /app/mediafiles/;
    include /etc/nginx/kg-headers.conf;
    add_header X-Robots-Tag        "noindex"    always;
    add_header Content-Disposition "attachment" always;
    # Ikkinchi CSP — birinchisi bilan BIRGA amal qiladi (brauzer
    # ikkalasini ham tekshiradi). Yuklangan fayl to'g'ridan-to'g'ri
    # ochilsa (masalan, ichida skripti bor SVG), u qum qutisida
    # ochiladi va hech narsa bajarmaydi.
    add_header Content-Security-Policy "sandbox" always;
}

# --- SPA + prerender qilingan public sahifalar ---
#
# Rejimga qarab ikki xil (PLAN 5.6): SaaS'da sotuv sayti, `/` → `/uz`
# va haqiqiy `404`; standalone'da esa ilova domen ildizida va har
# qanday yo'lni o'zi hal qiladi. Qaysi biri — `entrypoint.sh`
# `DEPLOYMENT_MODE` ga qarab tanlaydi (`_spa_saas.conf`,
# `_spa_standalone.conf`).
include /etc/nginx/kg-spa.conf;

gzip on;
gzip_types text/plain text/css application/json application/javascript
           text/xml application/xml image/svg+xml;
gzip_min_length 1024;
